<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pendel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F3EF">
<title>Pendelappen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* En kolumn i telefonbredd: rubrik, riktningsväxel, reskort. Detalj och inställningar ersätter listan. */
:root {
  --bg: #F4F3EF; --card: #FFFFFF; --fg: #16181D; --muted: #5A5F69; --line: #DEDCD5; --soft: #E7E5DE; --hair: #ECEAE4;
  --ink: #16181D; --on-ink: #FFFFFF; --on-ink-muted: #C9CBD1; --accent: #C2410C;
  --ok-bg: #DCFCE7; --ok-fg: #166534; --warn-bg: #FFEDD5; --warn-fg: #9A3412; --bad-bg: #FEE2E2; --bad-fg: #991B1B;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'Azeret Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --card: #1C1F24; --fg: #EEEDE8; --muted: #9A9FA8; --line: #2C3038; --soft: #2A2E35; --hair: #262A31;
  --ink: #EEEDE8; --on-ink: #121417; --on-ink-muted: #4A4F58; --accent: #EA6A33;
  --ok-bg: #12351F; --ok-fg: #86EFAC; --warn-bg: #3D2312; --warn-fg: #FDBA74; --bad-bg: #3F1616; --bad-fg: #FCA5A5;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121417; --card: #1C1F24; --fg: #EEEDE8; --muted: #9A9FA8; --line: #2C3038; --soft: #2A2E35; --hair: #262A31;
  --ink: #EEEDE8; --on-ink: #121417; --on-ink-muted: #4A4F58; --accent: #EA6A33;
  --ok-bg: #12351F; --ok-fg: #86EFAC; --warn-bg: #3D2312; --warn-fg: #FDBA74; --bad-bg: #3F1616; --bad-fg: #FCA5A5;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--sans); font-size: 15px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 32px; display: flex; flex-direction: column; gap: 20px; }
.mono { font-family: var(--mono); }
.label { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
h1 { margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1; text-wrap: balance; }
.sub { font-size: 15px; color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.iconbtn { width: 44px; height: 44px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.iconbtn svg { stroke: var(--fg); }
.iconbtn.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .iconbtn.spin svg { animation: none; } }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; }
.seg button { height: 44px; border: none; border-radius: 9px; background: transparent; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }

.list { display: flex; flex-direction: column; gap: 12px; }
.trip.dim { opacity: 0.6; }

/* Dra förbi kanten för fler avgångar. Knappen fungerar också att trycka på. */
.more { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; border: 1px dashed var(--line); border-radius: 12px; background: transparent; color: var(--muted); font-family: var(--mono); font-size: 12px; transition: background 0.15s, color 0.15s, transform 0.15s; }
.more svg { stroke: currentColor; transition: transform 0.2s; }
.more.armed { background: var(--soft); color: var(--fg); border-style: solid; }
.more.armed svg { transform: rotate(180deg); }
.more.busy { color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .more, .more svg { transition: none; } }

/* Tidshjul i stil med iOS-larmet: tre synliga rader, mittenraden är vald. */
.picker { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wheels { position: relative; display: flex; align-items: center; justify-content: center; gap: 4px; height: 132px; width: 100%; max-width: 240px; }
.band { position: absolute; left: 0; right: 0; top: 44px; height: 44px; background: var(--soft); border-radius: 10px; pointer-events: none; }
.wheel { position: relative; height: 132px; width: 84px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.wheel .pad { height: 44px; }
.wheel .it { height: 44px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; user-select: none; -webkit-user-select: none; }
.wheel .it.on { color: var(--fg); font-weight: 700; }
.colon { position: relative; font-size: 28px; font-weight: 700; color: var(--fg); padding-bottom: 3px; }
.pickhint { font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 16px; }
.trip { display: flex; flex-direction: column; gap: 14px; background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--line); text-align: left; width: 100%; }
.trip.first { border: 2px solid var(--ink); padding: 15px; }
.big { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.mid { font-family: var(--mono); font-size: 20px; font-weight: 600; }
.chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; }
.chip { background: var(--soft); border-radius: 6px; padding: 4px 7px; font-weight: 600; }
.chip.dark { background: var(--ink); color: var(--on-ink); }
.chip.gone { text-decoration: line-through; }
.sep { color: var(--muted); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.pill { border-radius: 999px; padding: 4px 10px; font-weight: 600; white-space: nowrap; }
.ok { background: var(--ok-bg); color: var(--ok-fg); }
.warn { background: var(--warn-bg); color: var(--warn-fg); }
.bad { background: var(--bad-bg); color: var(--bad-fg); }
.note { color: var(--muted); text-align: right; }

.banner { border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45; }
.banner b { font-weight: 600; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 16px; padding: 24px 16px; text-align: center; color: var(--muted); line-height: 1.5; }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; }

.back { display: inline-flex; align-items: center; gap: 6px; height: 44px; background: none; border: none; padding: 0; font-weight: 500; align-self: flex-start; }
.back svg { stroke: var(--fg); }
.trackcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: var(--on-ink); border-radius: 16px; padding: 16px 18px; }
.trackcard .label { color: var(--on-ink-muted); }
.track { display: flex; flex-direction: column; align-items: center; background: var(--accent); color: #FFFFFF; border-radius: 12px; padding: 6px 14px; min-width: 64px; }
.track .t1 { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.track .t2 { font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.steps { display: flex; flex-direction: column; background: var(--card); border-radius: 16px; padding: 8px 16px; border: 1px solid var(--line); }
.stop { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.stop .tm { width: 60px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.stop .sb { font-size: 13px; color: var(--muted); }
.stop.dep { padding-top: 12px; }
.stop.dep .tm { font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.stop.dep .pl { font-size: 16px; font-weight: 600; line-height: 1.35; }
.stop.arr { padding: 2px 0 8px; }
.stop.arr .tm { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--muted); padding-top: 1px; }
.stop.arr .pl { font-size: 14px; font-weight: 500; color: var(--muted); }
.stop.arr .sb { font-size: 12px; }
.gap { padding: 6px 0 6px 72px; }
.gap span { font-family: var(--mono); font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }

.panel { display: flex; flex-direction: column; background: var(--card); border-radius: 16px; padding: 4px 16px; border: 1px solid var(--line); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.setrow:last-child { border-bottom: none; }
.stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 600; }
.stepper output { font-family: var(--mono); font-size: 15px; font-weight: 600; width: 56px; text-align: center; }
.check { width: 24px; height: 24px; accent-color: var(--ink); flex-shrink: 0; }
.field { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 12px; font-family: var(--mono); font-size: 16px; }
.small { font-size: 13px; color: var(--muted); line-height: 1.45; }
.small a { color: var(--fg); }
</style>
</head>
<body>

<div class="wrap">

  <!-- LISTA -->
  <section id="v-list">
    <div class="wrap" style="padding:0">
      <div class="row">
        <div class="col">
          <div class="eyebrow" id="today"></div>
          <h1 id="title">Till jobbet</h1>
          <div class="sub" id="route">Hammarbyhöjden → Finnslätten</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="iconbtn" id="refresh" aria-label="Uppdatera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
          </button>
          <button class="iconbtn" id="open-settings" aria-label="Mina marginaler">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
          </button>
        </div>
      </div>

      <div class="seg" role="group" aria-label="Riktning">
        <button id="dir-work" aria-pressed="true">Till jobbet</button>
        <button id="dir-home" aria-pressed="false">Hem</button>
      </div>

      <div class="seg" role="group" aria-label="När">
        <button id="mode-now" aria-pressed="true">Åk nu</button>
        <button id="mode-arrive" aria-pressed="false">Framme senast</button>
      </div>

      <div class="picker" id="picker" hidden>
        <div class="wheels">
          <div class="band" aria-hidden="true"></div>
          <div class="wheel" id="wheel-h" tabindex="0" role="listbox" aria-label="Timme"></div>
          <div class="colon" aria-hidden="true">:</div>
          <div class="wheel" id="wheel-m" tabindex="0" role="listbox" aria-label="Minut"></div>
        </div>
        <div class="pickhint" id="pick-hint"></div>
      </div>

      <div id="banner" hidden></div>
      <button class="more" id="more-before" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        <span>Visa tidigare avgångar</span>
      </button>
      <div class="list" id="trips"></div>
      <button class="more" id="more-after" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>
        <span>Dra upp för senare avgångar</span>
      </button>
      <div class="status" id="updated"></div>
    </div>
  </section>

  <!-- DETALJ -->
  <section id="v-detail" hidden>
    <div class="wrap" style="padding:0;gap:18px">
      <button class="back" data-go="list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        Alla alternativ
      </button>
      <div id="detail"></div>
    </div>
  </section>

  <!-- INSTÄLLNINGAR -->
  <section id="v-settings" hidden>
    <div class="wrap" style="padding:0;gap:18px">
      <button class="back" data-go="list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        Klar
      </button>
      <div class="col">
        <h1>Mina marginaler</h1>
        <div class="sub">Hur lång tid du behöver i varje steg. Appen väljer bara anslutningar där bytet håller.</div>
      </div>
      <div class="seg" role="group" aria-label="Marginaler för">
        <button id="set-work" aria-pressed="true">Till jobbet</button>
        <button id="set-home" aria-pressed="false">Hem</button>
      </div>
      <div class="panel" id="margins"></div>
      <div class="panel">
        <label class="setrow" for="hide-fast">
          <span class="col" style="gap:1px">
            <span style="font-weight:600">Dölj SJ Snabbtåg</span>
            <span class="small">Visar bara regionaltåg</span>
          </span>
          <input type="checkbox" class="check" id="hide-fast">
        </label>
      </div>
      <div class="panel" style="padding:14px 16px;gap:10px">
        <label for="pin" style="font-weight:600">PIN-kod</label>
        <input class="field" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Samma som APP_PIN på Vercel">
        <div class="small">Sparas bara i den här telefonen. Felsökning: <a href="api/debug" id="debug-link" target="_blank" rel="noopener">visa hållplatser och nyckelstatus</a></div>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';
  var MIN = 60000;
  var TZ = 'Europe/Stockholm';

  // ---------- Lagring ----------
  var KEYS = ['walkHome', 'changeC', 'changeV', 'walkWork'];
  var BASE = { walkHome: 5, changeC: 10, changeV: 5, walkWork: 3 };
  function load() {
    var s = {};
    try { s = JSON.parse(localStorage.getItem('pendel') || '{}') || {}; } catch (e) {}
    var old = {};
    KEYS.forEach(function (k) { if (typeof s[k] === 'number') old[k] = s[k]; });
    var m = s.margins || {};
    return {
      hideFast: !!s.hideFast,
      pin: s.pin || '',
      mode: s.mode === 'arrive' ? 'arrive' : 'now',
      arrive: Object.assign({ work: '08:30', home: '17:30' }, s.arrive),
      margins: {
        work: Object.assign({}, BASE, old, m.work),
        home: Object.assign({}, BASE, old, m.home)
      }
    };
  }
  function marginsFor(d) { return Object.assign({ hideFast: cfg.hideFast }, cfg.margins[d]); }
  function save() { try { localStorage.setItem('pendel', JSON.stringify(cfg)); } catch (e) {} }
  var cfg = load();

  // ---------- Tid ----------
  var hm = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  var dayFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'short' });
  function t(ms) { return ms == null ? '–' : hm.format(new Date(ms)); }
  function mins(ms) { return Math.round(ms / MIN); }
  function dur(ms) { var m = mins(ms); return m >= 60 ? Math.floor(m / 60) + ' tim ' + (m % 60) + ' min' : m + ' min'; }

  // Framme senast: vald klockslag i dag, eller i morgon om det redan har passerat.
  function targetMs(hhmm, now) {
    var p = String(hhmm).split(':');
    var d = new Date(now);
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Number(p[0]), Number(p[1]), 0, 0).getTime();
    if (x < now + 20 * MIN) x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, Number(p[0]), Number(p[1]), 0, 0).getTime();
    return x;
  }
  function currentTarget() { return cfg.mode === 'arrive' ? targetMs(cfg.arrive[dir], Date.now()) : null; }
  function wantKey() { return dir + '|' + (cfg.mode === 'arrive' ? cfg.arrive[dir] : 'now'); }

  // ---------- Bygg resor (ren funktion, testbar) ----------
  function latest(list, ok) { var best = null; list.forEach(function (x) { if (!x.canceled && ok(x) && (!best || x.from.rt > best.from.rt)) best = x; }); return best; }
  function earliest(list, ok) { var best = null; list.forEach(function (x) { if (!x.canceled && ok(x) && (!best || x.from.rt < best.from.rt)) best = x; }); return best; }

  function buildTrips(d, m, now, target) {
    var out = [];
    (d.trains || []).forEach(function (tr) {
      if (m.hideFast && /snabbt|x ?2000/i.test(tr.product || '')) return;
      var dep = tr.from.rt, arr = tr.to.rt, metro, bus, leave, arrive, gaps;
      // Saknas T-bane- eller bussdata helt (t.ex. om Trafiklab inte svarar) uppskattas steget från marginal och åktid.
      var noMetro = !(d.metro && d.metro.length), noBus = !(d.bus && d.bus.length);
      var est = function (line, fromRt, ride, fromName, toName) {
        return { line: line, dest: '', est: true, canceled: false, from: { sched: fromRt, rt: fromRt, name: fromName }, to: { sched: fromRt + ride * MIN, rt: fromRt + ride * MIN, name: toName } };
      };
      if (d.dir === 'work') {
        metro = noMetro ? est('17', dep - m.changeC * MIN - 12 * MIN, 12, 'Hammarbyhöjden', 'T-Centralen') : latest(d.metro, function (x) { return x.to.rt <= dep - m.changeC * MIN; });
        bus = noBus ? est('4', arr + m.changeV * MIN, 10, 'Västerås Centralstation', 'Finnslätten') : earliest(d.bus, function (x) { return x.from.rt >= arr + m.changeV * MIN; });
        leave = metro ? metro.from.rt - m.walkHome * MIN : null;
        arrive = bus ? bus.to.rt + m.walkWork * MIN : null;
        gaps = [metro ? dep - metro.to.rt : null, bus ? bus.from.rt - arr : null];
      } else {
        bus = noBus ? est('4', dep - m.changeV * MIN - 13 * MIN, 13, 'Finnslätten', 'Västerås Centralstation') : latest(d.bus, function (x) { return x.to.rt <= dep - m.changeV * MIN; });
        metro = noMetro ? est('17', arr + m.changeC * MIN, 12, 'T-Centralen', 'Hammarbyhöjden') : earliest(d.metro, function (x) { return x.from.rt >= arr + m.changeC * MIN; });
        leave = bus ? bus.from.rt - m.walkWork * MIN : null;
        arrive = metro ? metro.to.rt + m.walkHome * MIN : null;
        gaps = [bus ? dep - bus.to.rt : null, metro ? metro.from.rt - arr : null];
      }
      var firstStep = d.dir === 'work' ? metro : bus;
      var missed = firstStep ? firstStep.from.rt < now : dep < now;
      if (missed && tr.extra !== 'before' && !d.showPast) return;
      var late = !!(target && (arrive == null || arrive > target));
      if (late && tr.extra !== 'after') return;
      var delay = mins(tr.from.rt - tr.from.sched);
      var status;
      if (tr.canceled) status = { text: 'Inställt', cls: 'bad' };
      else if (missed) status = { text: 'Hinns inte', cls: 'bad' };
      else if (!metro || !bus) status = { text: 'Anslutning saknas', cls: 'warn' };
      else if (metro.est || bus.est) status = { text: 'Uppskattad tid', cls: 'warn' };
      else if (delay > 0) status = { text: 'Tåget +' + delay + ' min', cls: 'warn' };
      else status = { text: 'I tid', cls: 'ok' };
      out.push({ train: tr, metro: metro, bus: bus, leave: leave, arrive: arrive, gaps: gaps, delay: delay, status: status, missed: missed, late: late });
    });
    return out;
  }

  // ---------- Exempeldata (när appen inte når sitt API) ----------
  function demo(dir, now, target, baseMs) {
    var base = Math.floor((baseMs || (target ? target - 3 * 60 * MIN : now)) / (30 * MIN)) * 30 * MIN;
    var tr = [], me = [], bu = [];
    for (var i = 0; i < 5; i++) {
      var dep = base + (i * 30 + 25) * MIN, late = i === 1 ? 4 * MIN : 0;
      tr.push({ id: String(870 + i * 2), product: 'SJ Regional', operator: 'SJ', canceled: false, deviations: [],

      renderList();
      clearTimeout(fetchTimer);
      fetchTimer = setTimeout(fetchData, 700);
    }, 160);
  }
  function onWheelClick(e) {
    var it = e.target.closest('.it');
    if (it) e.currentTarget.scrollTo({ top: Number(it.getAttribute('data-i')) * ROW, behavior: 'smooth' });
  }
  function onWheelKey(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    var el = e.currentTarget;
    el.scrollTo({ top: (wheelIndex(el) + (e.key === 'ArrowDown' ? 1 : -1)) * ROW, behavior: 'smooth' });
  }
  buildWheel($('wheel-h'), HOURS);
  buildWheel($('wheel-m'), MINS);
  ['wheel-h', 'wheel-m'].forEach(function (id) {
    $(id).addEventListener('scroll', onWheelScroll, { passive: true });
    $(id).addEventListener('click', onWheelClick);
    $(id).addEventListener('keydown', onWheelKey);
  });
  function showPicker() {
    renderHeader();
    if (cfg.mode === 'arrive') requestAnimationFrame(function () { setPicker(cfg.arrive[dir]); });
  }

  // ---------- Händelser ----------
  $('mode-now').addEventListener('click', function () { if (cfg.mode !== 'now') { cfg.mode = 'now'; save(); showPicker(); renderList(); fetchData(); } });
  $('mode-arrive').addEventListener('click', function () { if (cfg.mode !== 'arrive') { cfg.mode = 'arrive'; save(); showPicker(); renderList(); fetchData(); } });
  $('dir-work').addEventListener('click', function () { if (dir !== 'work') { dir = 'work'; showPicker(); renderList(); fetchData(); } });
  $('dir-home').addEventListener('click', function () { if (dir !== 'home') { dir = 'home'; showPicker(); renderList(); fetchData(); } });
  $('refresh').addEventListener('click', fetchData);
  $('more-before').addEventListener('click', function () { loadMore('before'); });
  $('more-after').addEventListener('click', function () { loadMore('after'); });
  $('open-settings').addEventListener('click', function () { setDir = dir; renderSettings(); show('settings'); });
  $('set-work').addEventListener('click', function () { setDir = 'work'; renderSettings(); });
  $('set-home').addEventListener('click', function () { setDir = 'home'; renderSettings(); });
  $('trips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-i]');
    if (b) { selected = Number(b.getAttribute('data-i')); renderDetail(); }
  });
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) { show('list'); showPicker(); renderList(); }
  });
  $('margins').addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]');
    if (!b) return;
    var k = b.getAttribute('data-k'), vals = cfg.margins[setDir];
    vals[k] = Math.max(0, Math.min(60, vals[k] + Number(b.getAttribute('data-d'))));
    $('out-' + k).textContent = vals[k] + ' min';
    save();
  });
  $('hide-fast').addEventListener('change', function (e) { cfg.hideFast = e.target.checked; save(); });
  $('pin').addEventListener('change', function (e) {
    cfg.pin = e.target.value.trim(); save();
    if (problem && problem.kind === 'pin') fetchData();
  });

  // Uppdatera var 90:e sekund när appen syns, och direkt när den öppnas igen.
  setInterval(function () { if (!document.hidden && !$('v-list').hidden) fetchData(); }, 90000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && data && Date.now() - data.generatedAt > 60000) fetchData();
  });
  setInterval(function () { if (!$('v-list').hidden && data) renderList(); }, 20000);

  window.__pendel = { buildTrips: buildTrips, demo: demo, targetMs: targetMs };
  showPicker();
  renderList();
  fetchData();
})();
</script>
</body>
</html>
